services:
  - type: web
    name: intelligent-test-prep-api
    runtime: docker
    plan: starter
    dockerContext: .
    dockerfilePath: ./services/api/Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic -c services/api/migrations/alembic.ini upgrade head && python -m services.api.seed
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: intelligent-test-prep-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: intelligent-test-prep-db
    plan: basic-256mb
    databaseName: testprep
    user: testprep