version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: testprep-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-testprep}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testprep_dev_password}
      POSTGRES_DB: ${DB_NAME:-testprep_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-testprep}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testprep-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: testprep-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testprep-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: testprep-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-testprep_qdrant_key}
    networks:
      - testprep-network

  # Backend API Service
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: testprep-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${DB_USER:-testprep}:${DB_PASSWORD:-testprep_dev_password}@postgres:5432/${DB_NAME:-testprep_db}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your_secret_key_here_change_in_production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./services/api:/app/services/api
      - ./packages/shared:/app/packages/shared
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - testprep-network

  # Frontend Next.js Service
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: testprep-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    command: npm run dev
    networks:
      - testprep-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  testprep-network:
    driver: bridge
