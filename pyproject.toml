[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-test-prep-api"
version = "0.1.0"
description = "AI-Powered Intelligent Test Preparation Platform - Backend API"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AI Agent", email = "ai@testprep.local" }
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "httpx>=0.24.0",
    "redis>=5.0.0",
    "openai>=1.0.0",
    "qdrant-client>=1.9.1,<2.0",
    "PyJWT>=2.8.0",
    "email-validator>=2.0.0",
    "tenacity>=8.2.0",
    "pydantic-core>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "types-python-jose>=1.2.0",
    "types-aiofiles>=23.2.0"
]

[tool.setuptools]
packages = ["services.api", "services.ai", "packages.shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=services --cov-report=html"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "passlib.*",
    "tenacity.*"
]
ignore_missing_imports = true
